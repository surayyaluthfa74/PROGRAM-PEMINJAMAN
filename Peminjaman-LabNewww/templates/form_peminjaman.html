<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ajukan Peminjaman</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card p-4 mx-auto shadow-sm" style="max-width: 550px">
        <h3>Ajukan Peminjaman Barang</h3>

        {% with messages = get_flashed_messages() %} {% for message in messages
        %}
        <div class="alert alert-info">{{ message }}</div>
        {% endfor %} {% endwith %}

        <form method="POST">
          <label class="form-label">Pilih Barang</label>
          <select name="barang_id" class="form-select mb-3" required>
            <option value="">-- Pilih Barang --</option>
            {% for item in barang %}
            <option value="{{ item['id'] }}">
              {{ item['nama_barang'] }} (Stok: {{ item['stok'] }})
            </option>
            {% endfor %}
          </select>

          <label class="form-label">Jumlah</label>
          <input
            type="number"
            name="jumlah"
            min="1"
            class="form-control mb-3"
            required
          />

          <label class="form-label">Tanggal Pinjam</label>
          <input
            type="date"
            name="tanggal_pinjam"
            class="form-control mb-3"
            value="{{ hari_ini }}"
            min="{{ hari_ini }}"
            required
          />

          <label class="form-date">Tenggat Pengembalian</label>
          <input
            type="date"
            name="tenggat_kembali"
            class="form-control mb-3"
            min="{{ hari_ini }}"
            required
          />

          <button class="btn btn-primary w-100">Kirim Pengajuan</button>
        </form>
        <a
          href="{{ url_for('dashboard_mahasiswa') }}"
          class="btn btn-outline-secondary mt-3"
          >Kembali</a
        >
      </div>
    </div>
  </body>
</html>
