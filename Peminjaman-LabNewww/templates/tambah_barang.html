<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tambah Barang</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card p-4 mx-auto shadow-sm" style="max-width: 600px">
        <h3>Tambah Barang Laboratorium</h3>

        {% with messages = get_flashed_messages() %} {% for message in messages
        %}
        <div class="alert alert-info">{{ message }}</div>
        {% endfor %} {% endwith %}

        <form method="POST">
          <label class="form-label">Nama Barang</label>
          <input name="nama_barang" class="form-control mb-3" required />

          <label class="form-label">Kategori</label>
          <input name="kategori" class="form-control mb-3" />

          <label class="form-label">Stok Awal</label>
          <input
            name="stok"
            type="number"
            min="0"
            class="form-control mb-3"
            required
          />

          <label class="form-label">Nama File Gambar</label>
          <input
            name="gambar"
            class="form-control mb-1"
            placeholder="contoh: lan_tester.jpg"
          />
          <small class="text-secondary"
            >Letakkan gambar tersebut di static/images/</small
          >

          <button class="btn btn-primary w-100 mt-3">Simpan Barang</button>
        </form>
        <a
          href="{{ url_for('dashboard_admin') }}"
          class="btn btn-outline-secondary mt-3"
          >Kembali</a
        >
      </div>
    </div>
  </body>
</html>
