<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Admin - LabConnect</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #32050b, #700018, #4a0710);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .login-card {
        background: #ffffff;
        width: 100%;
        max-width: 430px;
        padding: 32px;
        border-radius: 20px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      }

      .logo {
        width: 110px;
        height: 110px;
        margin: 0 auto 15px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .brand-title,
      .form-label {
        color: #4a0710;
      }

      .btn-login {
        background: #700018;
        color: white;
        border: none;
        padding: 12px;
        font-weight: bold;
        border-radius: 9px;
      }

      .btn-login:hover {
        background: #32050b;
        color: white;
      }

      .form-control {
        padding: 10px 12px;
        border-radius: 8px;
      }

      .form-control:focus {
        border-color: #700018;
        box-shadow: 0 0 0 0.2rem rgba(74, 7, 16, 0.15);
      }

      .form-label {
        font-weight: 600;
      }

      .login-link {
        color: #700018;
        text-decoration: none;
        font-weight: 600;
      }

      .login-link:hover {
        color: #32050b;
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <div class="logo">
        <img
          src="{{ url_for('static', filename='images/logo-kampus.png') }}"
          alt="Logo Universitas Almarisah Madani"
        />
      </div>

      <h3 class="text-center fw-bold brand-title">LabConnect</h3>

      <p class="text-center text-muted mb-4">
        Universitas Almarisah Madani<br />
        Sistem Peminjaman Barang Laboratorium
      </p>

      {% with pesan = get_flashed_messages() %} {% for p in pesan %}
      <div class="alert alert-info">{{ p }}</div>
      {% endfor %} {% endwith %}

      <h5 class="mb-3 brand-title">Login Administrator</h5>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Masukkan username"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Masukkan password"
            required
          />
        </div>

        <button type="submit" class="btn btn-login w-100">Login Admin</button>
      </form>

      <hr />

      <p class="text-center mb-0">
        Login sebagai mahasiswa?
        <a class="login-link" href="{{ url_for('login_mahasiswa') }}">
          Klik di sini
        </a>
      </p>
    </div>
  </body>
</html>
